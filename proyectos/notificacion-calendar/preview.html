<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Reminder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: transparent;
    overflow: hidden;
    width: 100vw;
    height: 100vh;
  }
  @keyframes volar {
    0%   { transform: translateX(110vw); }
    100% { transform: translateX(-800px); }
  }
  .vuelo {
    position: absolute;
    top: 15px;
    display: inline-flex;
    align-items: center;
    animation: volar 12s linear 1 forwards;
  }
  #lottie-player {
    width: 250px;
    height: 190px;
    flex-shrink: 0;
  }
  .cuerda {
    width: 80px;
    flex-shrink: 0;
  }
  @keyframes balanceo {
    0%, 100% { transform: rotate(-0.8deg); }
    50%       { transform: rotate(0.8deg); }
  }
  .banner-wrap {
    animation: balanceo 2.4s ease-in-out infinite;
    transform-origin: left center;
    flex-shrink: 0;
  }
  .banner {
    width: 190px;
    background: #f9e9da;
    border-radius: 0;
    overflow: hidden;
    border: 3px solid #160d1b;
    box-shadow: 0 0 0 2px white;
    font-family: 'Press Start 2P', monospace;
    image-rendering: pixelated;
  }
  .banner-header {
    background: #fe89b7;
    padding: 10px 10px;
    border-bottom: 3px solid #160d1b;
  }
  .banner-header span {
    color: #160d1b;
    font-size: 8px;
    line-height: 1.6;
    display: block;
    word-break: break-word;
    text-align: center;
  }
  .banner-body { padding: 10px; }
  .btn {
    display: block;
    width: 100%;
    background: #160d1b;
    color: #fe89b7;
    font-family: 'Press Start 2P', monospace;
    font-size: 7px;
    text-align: center;
    padding: 10px 6px;
    border-radius: 0;
    text-decoration: none;
    border: 2px solid #fe89b7;
    line-height: 1.5;
    letter-spacing: 0.3px;
    box-shadow: 3px 3px 0 #fe89b7;
  }
</style>
</head>
<body>

<div class="vuelo">
  <div id="lottie-player"></div>
  <svg class="cuerda" viewBox="0 0 80 20" fill="none" xmlns="http://www.w3.org/2000/svg">
    <line x1="0" y1="10" x2="80" y2="10" stroke="white" stroke-width="5"/>
    <line x1="0" y1="10" x2="80" y2="10" stroke="#160d1b" stroke-width="3"/>
  </svg>
  <div class="banner-wrap">
    <div class="banner">
      <div class="banner-header">
        <span>Daily standup</span>
      </div>
      <div class="banner-body">
        <a class="btn" href="https://meet.google.com/test" onclick="window.open('https://meet.google.com/test','_blank');return false;">UNIRSE AHORA</a>
      </div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie.min.js"></script>
<script>
lottie.loadAnimation({
  container: document.getElementById('lottie-player'),
  renderer: 'canvas',
  loop: true,
  autoplay: true,
  path: 'notificacion2.json'
});

document.querySelector('.vuelo').addEventListener('animationend', () => {
  window.close();
});
</script>
</body>
</html>
