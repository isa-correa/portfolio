<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lanzarote — Photos</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg-from: #e8e0d5;
    --bg-mid: #d4cbc0;
    --bg-to: #c8bfb4;
    --accent: #0D99FF;
    --accent2: #66C8FF;
    --glass: rgba(255,255,255,0.72);
    --glass-border: rgba(255,255,255,0.9);
    --shadow: rgba(0,0,0,0.18);
    --text: #1a1a1a;
    --text-mid: #555;
    --text-light: #888;
    --menubar-h: 28px;
    --dock-h: 72px;
    --btn-red: #ff5f57;
    --btn-yellow: #febc2e;
    --btn-green: #28c840;
    --serif: 'Georgia', serif;
    --sans: -apple-system, 'Helvetica Neue', sans-serif;
  }

  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    font-family: var(--sans);
    user-select: none;
    cursor: default;
    background: #000;
  }

  body { opacity: 0; }
  body.loaded { opacity: 1; transition: opacity 0.8s cubic-bezier(0.25, 0.1, 0.25, 1); }

  /* ── BACKGROUND ─────────────────────────────────── */
  #desktop {
    position: fixed; inset: 0;
    background: #000;
    overflow: hidden;
  }

  .window.visible { animation: none; }

  /* grain overlay */
  #grain {
    position: fixed; inset: 0; pointer-events: none; z-index: 1;
    opacity: 0.045;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
    background-size: 180px;
    animation: grainAnim 0.8s steps(2) infinite;
  }
  @keyframes grainAnim {
    0%   { background-position: 0 0; }
    25%  { background-position: -20px 10px; }
    50%  { background-position: 10px -15px; }
    75%  { background-position: -10px 5px; }
    100% { background-position: 5px -5px; }
  }

  /* ── MENU BAR ────────────────────────────────────── */
  #menubar {
    position: fixed; top: 0; left: 0; right: 0;
    height: var(--menubar-h);
    background: rgba(40,40,42,0.92);
    backdrop-filter: blur(20px) saturate(1.4);
    -webkit-backdrop-filter: blur(20px) saturate(1.4);
    border-bottom: 1px solid rgba(0,0,0,0.4);
    display: flex; align-items: center;
    padding: 0 16px;
    z-index: 9999;
    font-size:15px; font-weight: 500;
    color: #fff;
  }
  #menubar .apple { font-size:17px; margin-right: 16px; color: #fff; }
  #menubar .apple svg { fill: #fff; }
  #menubar .menu-items { display: flex; gap: 16px; }
  #menubar .menu-items span { opacity: 0.75; font-weight: 400; cursor: default; color: #fff; }
  #menubar .menu-items span:first-child { font-weight: 600; opacity: 1; color: #fff; }
  #menubar .right { margin-left: auto; display: flex; align-items: center; gap: 12px; font-size:14px; color: rgba(255,255,255,0.75); }
  #menubar .right svg { fill: rgba(255,255,255,0.75); }
  #clock { font-variant-numeric: tabular-nums; }

  /* ── WINDOWS ─────────────────────────────────────── */
  .window {
    position: fixed;
    min-width: 420px; min-height: 300px;
    background: rgba(242,238,232,0.90);
    backdrop-filter: blur(30px) saturate(1.5);
    -webkit-backdrop-filter: blur(30px) saturate(1.5);
    border: 1px solid rgba(255,255,255,0.85);
    border-radius: 12px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.22), 0 4px 12px rgba(0,0,0,0.12), inset 0 1px 0 rgba(255,255,255,0.9);
    display: none; flex-direction: column;
    overflow: hidden;
    z-index: 100;
    animation: windowOpen 0.2s cubic-bezier(0.34,1.56,0.64,1);
  }
  @keyframes windowOpen {
    from { transform: scale(0.88); opacity: 0; }
    to   { transform: scale(1); opacity: 1; }
  }
  .window.visible { display: flex; }

  .win-titlebar {
    height: 38px; min-height: 38px;
    background: linear-gradient(180deg, rgba(255,255,255,0.6) 0%, rgba(240,235,228,0.5) 100%);
    border-bottom: 1px solid rgba(0,0,0,0.08);
    display: flex; align-items: center;
    padding: 0 12px;
    cursor: move;
    flex-shrink: 0;
    position: relative;
  }
  .win-buttons { display: flex; gap: 8px; align-items: center; }
  .win-btn {
    width: 13px; height: 13px;
    border-radius: 50%;
    border: none; cursor: pointer;
    transition: filter 0.15s;
    position: relative;
  }
  .win-btn:hover { filter: brightness(0.85); }
  .win-btn.close { background: var(--btn-red); }
  .win-btn.minimize { background: var(--btn-yellow); }
  .win-btn.maximize { background: var(--btn-green); }
  .win-btn .btn-icon {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    font-size:10px; font-weight: 700; color: rgba(0,0,0,0.5);
    opacity: 0;
  }
  .win-buttons:hover .btn-icon { opacity: 1; }
  .win-title {
    position: absolute;
    left: 0; right: 0;
    text-align: center;
    font-size:15px; font-weight: 500;
    color: var(--text-mid);
    pointer-events: none;
  }
  .win-body { flex: 1; overflow-y: auto; padding: 20px 24px; }
  .win-body::-webkit-scrollbar { width: 6px; }
  .win-body::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.15); border-radius: 3px; }

  /* ── DOCK ────────────────────────────────────────── */
  #dock {
    position: fixed;
    bottom: 8px;
    left: 50%; transform: translateX(-50%);
    height: var(--dock-h);
    background: rgba(240,235,228,0.70);
    backdrop-filter: blur(28px) saturate(1.6);
    -webkit-backdrop-filter: blur(28px) saturate(1.6);
    border: 1px solid rgba(255,255,255,0.85);
    border-radius: 20px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.18), 0 2px 8px rgba(0,0,0,0.1), inset 0 1px 0 rgba(255,255,255,0.7);
    display: flex; align-items: flex-end;
    padding: 8px 18px;
    gap: 10px;
    z-index: 9998;
  }
  .dock-item {
    width: 52px; height: 52px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    border-radius: 12px;
    transition: transform 0.32s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    position: relative;
    flex-shrink: 0;
  }
  .dock-item:hover { transform: translateY(-9px) scale(1.16); }
  .dock-item:hover + .dock-item { transform: translateY(-4px) scale(1.08); }
  .dock-item:has(+ .dock-item:hover) { transform: translateY(-4px) scale(1.08); }
  .dock-icon {
    width: 48px; height: 48px;
    border-radius: 11px;
    display: flex; align-items: center; justify-content: center;
    font-size:28px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    overflow: hidden;
    position: relative;
  }
  .dock-tooltip {
    position: absolute; bottom: calc(100% + 10px);
    left: 50%; transform: translateX(-50%);
    background: rgba(40,40,40,0.88);
    color: #fff; font-size:13px; font-weight: 500;
    padding: 4px 10px; border-radius: 7px;
    white-space: nowrap; pointer-events: none;
    opacity: 0; transition: opacity 0.15s;
  }
  .dock-item:hover .dock-tooltip { opacity: 1; }
  .dock-separator {
    width: 1px; height: 40px;
    background: rgba(0,0,0,0.15);
    margin: 0 4px;
    align-self: center;
    flex-shrink: 0;
  }
  /* dock icon styles */
  .di-figma { background: linear-gradient(135deg, #1abcfe, #0acf83, #ff7262, #a259ff); }
  .di-claude { background: linear-gradient(135deg, #d4a574, #c8956a); }
  .di-cc { background: linear-gradient(135deg, #ff0000, #cc0000); }
  .di-mail { background: linear-gradient(180deg, #5cb8f7 0%, #1e7cf5 100%); }
  .di-notes { background: linear-gradient(180deg, #ffd60a 0%, #f5c400 100%); }
  .di-trash { background: transparent; box-shadow: none; }

  /* ── PHOTOS APP ──────────────────────────────────── */
  .photos-sidebar {
    width: 180px;
    min-width: 180px;
    background: rgba(220,214,206,0.6);
    border-right: 1px solid rgba(0,0,0,0.07);
    padding: 0;
    overflow-y: auto;
  }
  .photos-sidebar::-webkit-scrollbar { width: 4px; }
  .photos-sidebar::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.12); border-radius: 2px; }

  .sidebar-section-title {
    font-size: 12px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: #888;
    padding: 12px 14px 6px;
  }
  .sidebar-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 14px;
    font-size: 14px;
    font-weight: 500;
    color: #666;
    cursor: pointer;
    border-radius: 6px;
    margin: 0 8px 2px;
    transition: background 0.12s;
  }
  .sidebar-item:hover { background: rgba(0,0,0,0.05); }
  .sidebar-item.active {
    background: rgba(0,100,215,0.15);
    color: #0064d7;
  }
  .sidebar-item svg { flex-shrink: 0; }
  .sidebar-sep {
    border: none;
    border-top: 1px solid rgba(0,0,0,0.07);
    margin: 8px 14px;
  }

  /* ── PHOTO GRID ──────────────────────────────────── */
  .photos-main {
    flex: 1;
    overflow-y: auto;
    padding: 16px 20px;
  }
  .photos-main::-webkit-scrollbar { width: 6px; }
  .photos-main::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.15); border-radius: 3px; }

  .photos-toolbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
  }

  #photo-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
  }

  .photo-item {
    border-radius: 8px;
    overflow: hidden;
    cursor: pointer;
    aspect-ratio: 1;
    opacity: 0;
    transform: scale(0.94);
    transition: box-shadow 0.2s;
  }
  .photo-item.visible {
    animation: photoIn 0.35s ease forwards;
  }
  .photo-item img {
    width: 100%; height: 100%;
    object-fit: cover;
    transition: transform 0.25s ease;
    -webkit-user-drag: none;
    pointer-events: none;
  }
  .photo-item:hover { box-shadow: 0 4px 16px rgba(0,0,0,0.2); }
  .photo-item:hover img { transform: scale(1.05); }
  @keyframes photoIn {
    from { opacity:0; transform:scale(0.94); }
    to   { opacity:1; transform:scale(1); }
  }

  /* ── LIGHTBOX ────────────────────────────────────── */
  #lightbox {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.95);
    z-index: 999999;
    display: none; align-items: center; justify-content: center;
  }
  #lb-img {
    max-width: 90vw; max-height: 90vh;
    object-fit: contain;
    border-radius: 8px;
  }
  @keyframes lbIn {
    from { opacity:0; transform:scale(0.92); }
    to   { opacity:1; transform:scale(1); }
  }
  #lb-close {
    position: fixed; top: 20px; right: 22px;
    width: 38px; height: 38px;
    background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.15);
    border-radius: 50%; color: #fff; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.15s;
  }
  #lb-close:hover { background: rgba(255,255,255,0.22); }
  .lb-arrow {
    position: fixed; top: 50%; transform: translateY(-50%);
    width: 46px; height: 46px;
    background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.15);
    border-radius: 50%; color: #fff; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.15s;
  }
  .lb-arrow:hover { background: rgba(255,255,255,0.22); }
  #lb-prev { left: 22px; }
  #lb-next { right: 22px; }
  #lb-counter {
    position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%);
    color: rgba(255,255,255,0.45); font-size:14px; letter-spacing: 0.06em;
    pointer-events: none;
  }

  /* desktop-only: hide mobile-only elements */
  #mobile-back-btn { display: none; }
  #mobile-photos-header { display: none; }

  /* ── MOBILE ─────────────────────────────────────── */
  @media (max-width: 768px) {

    /* 1. MENUBAR */
    #menubar .menu-items span:not(:first-child) { display: none; }

    /* 5. DOCK */
    #dock { display: none !important; }

    /* 2. VENTANA FULLSCREEN */
    .window.visible {
      width: 100vw !important;
      height: 100vh !important;
      top: 0 !important;
      left: 0 !important;
      border-radius: 0 !important;
      box-shadow: none !important;
      border: none !important;
      min-width: 0 !important;
      min-height: 0 !important;
    }
    .win-titlebar { display: none !important; }
    #mobile-back-btn { display: flex !important; }

    /* 3. SIDEBAR */
    .photos-sidebar { display: none !important; }

    /* 7. TOOLBAR — iOS style */
    .photos-toolbar {
      display: flex !important;
      flex-direction: column !important;
      align-items: center !important;
      justify-content: center !important;
      padding-top: 52px !important;
      margin-bottom: 10px !important;
    }
    .photos-toolbar h2  { display: none !important; }
    .photos-toolbar input[type=range] { display: none !important; }
    #mobile-photos-header { display: block !important; text-align: center; }

    /* 4. GRID — 3 columnas */
    .photos-main { padding: 0 8px 8px !important; overflow-y: auto !important; }
    #photo-grid  { grid-template-columns: repeat(3, 1fr) !important; gap: 3px !important; }
    .photo-item  { border-radius: 4px !important; }

    /* 6. LIGHTBOX */
    .lb-arrow  { width: 60px !important; height: 60px !important; }
    #lb-prev   { left: 4px !important; }
    #lb-next   { right: 4px !important; }
    #lb-close  { width: 48px !important; height: 48px !important; top: 14px !important; right: 14px !important; }
  }
</style>
</head>

<!-- DESKTOP -->

</div><!-- /desktop -->

<!-- PHOTOS WINDOW -->

<!-- LIGHTBOX -->
<div id="lightbox">
  <button id="lb-close" onclick="closeLb()">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
  </button>
  <button id="lb-prev" class="lb-arrow" onclick="lbPrev()">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polyline points="15 18 9 12 15 6"/></svg>
  </button>
  <img id="lb-img" src="" alt="">
  <button id="lb-next" class="lb-arrow" onclick="lbNext()">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polyline points="9 18 15 12 9 6"/></svg>
  </button>
  <div id="lb-counter"></div>
</div>

<script>
// ── CLOCK ──────────────────────────────────────
function updateClock() {
  const now = new Date();
  const h = now.getHours().toString().padStart(2,'0');
  const m = now.getMinutes().toString().padStart(2,'0');
  const days = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  document.getElementById('clock').textContent =
    `${days[now.getDay()]} ${months[now.getMonth()]} ${now.getDate()} ${h}:${m}`;
}
updateClock(); setInterval(updateClock, 1000);

// ── ZOOM SLIDER ─────────────────────────────────
document.getElementById('zoom-slider').addEventListener('input', function() {
  const size = this.value + 'px';
  document.getElementById('photo-grid').style.gridTemplateColumns = `repeat(auto-fill, minmax(${size}, 1fr))`;
});

// ── INTERSECTION OBSERVER ───────────────────────
const observer = new IntersectionObserver((entries) => {
  entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add('visible'); observer.unobserve(e.target); } });
}, { threshold: 0.1 });
document.querySelectorAll('.photo-item').forEach(item => observer.observe(item));

// ── LIGHTBOX ─────────────────────────────────────
let lbIndex = 0;
const lbImgs = Array.from({length: 23}, (_, i) => `${i+1}.webp`);

function openLb(i) {
  lbIndex = i;
  renderLb();
  document.getElementById('lightbox').style.display = 'flex';
}
function renderLb() {
  const img = document.getElementById('lb-img');
  img.style.animation = 'none';
  img.offsetHeight;
  img.src = lbImgs[lbIndex];
  img.style.animation = 'lbIn 0.2s ease forwards';
  document.getElementById('lb-counter').textContent = `${lbIndex+1} / ${lbImgs.length}`;
}
function closeLb() { document.getElementById('lightbox').style.display = 'none'; }
function lbNext() { lbIndex = (lbIndex+1) % lbImgs.length; renderLb(); }
function lbPrev() { lbIndex = (lbIndex-1+lbImgs.length) % lbImgs.length; renderLb(); }

document.getElementById('lightbox').addEventListener('click', e => { if(e.target.id==='lightbox') closeLb(); });
document.addEventListener('keydown', e => {
  if (document.getElementById('lightbox').style.display !== 'flex') return;
  if (e.key==='Escape') closeLb();
  else if (e.key==='ArrowRight'||e.key==='ArrowDown') { e.preventDefault(); lbNext(); }
  else if (e.key==='ArrowLeft'||e.key==='ArrowUp') { e.preventDefault(); lbPrev(); }
});

// Lightbox swipe
(function() {
  let tStartX = 0;
  const lb = document.getElementById('lightbox');
  lb.addEventListener('touchstart', e => { tStartX = e.changedTouches[0].clientX; }, { passive: true });
  lb.addEventListener('touchend', e => {
    const dx = e.changedTouches[0].clientX - tStartX;
    if (Math.abs(dx) > 48) { dx < 0 ? lbNext() : lbPrev(); }
  }, { passive: true });
})();

const bgVideo = document.getElementById('bg-video');
function revealPage() {
  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      document.body.classList.add('loaded');
    });
  });
}
if (bgVideo) {
  if (bgVideo.readyState >= 3) {
    revealPage();
  } else {
    bgVideo.addEventListener('canplaythrough', revealPage, { once: true });
    setTimeout(revealPage, 2000);
  }
} else {
  revealPage();
}
</script>
